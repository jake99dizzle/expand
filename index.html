<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EXPAND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300&display=swap" rel="stylesheet">
<style>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #141414;
    touch-action: none;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }

  /* HUD */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 20px 22px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  #score {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 48px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }

  #pause-btn {
    pointer-events: all;
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    opacity: 0.7;
    transition: opacity 0.15s;
  }

  #pause-btn:active { opacity: 1; }

  .pause-bar {
    width: 3px;
    height: 16px;
    background: rgba(255,255,255,0.9);
    border-radius: 1px;
  }

  .pause-icon {
    display: flex;
    gap: 5px;
  }

  /* Screens */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    height: 100%;
  }

  .screen.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* Start Screen */
  #start-screen {
    background: #141414;
    justify-content: center;
    padding: 0;
    gap: 0;
  }

  .start-top {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10vh;
  }

  .start-middle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 8vh;
  }

  .start-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .game-title {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 72px;
    color: #fff;
    letter-spacing: 20px;
    line-height: 1;
    text-indent: 20px;
    text-align: center;
    width: 100%;
  }

  .game-subtitle {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 6px;
    text-transform: uppercase;
    text-align: center;
  }

  .instruction {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }

  .start-btn {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 8px;
    color: #141414;
    background: rgba(255,255,255,0.92);
    border: none;
    padding: 16px 52px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    text-transform: uppercase;
  }

  .start-btn:active {
    transform: scale(0.97);
    background: rgba(255,255,255,0.85);
  }

  /* Game Over Screen */
  #gameover-screen {
    background: #141414;
  }

  .go-label {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .go-score {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 120px;
    color: rgba(255,255,255,0.85);
    line-height: 1;
    letter-spacing: 4px;
  }

  .go-best-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    margin-bottom: 64px;
  }

  .go-best-label {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  .go-best-score {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 20px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 3px;
  }

  .new-best {
    position: fixed;
    bottom: 48px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 5px;
    text-transform: uppercase;
    animation: blink 1.2s ease infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 0.15; }
  }

  /* Pause Screen */
  #pause-screen {
    background: rgba(20,20,20,0.93);
  }

  .pause-title {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 42px;
    color: #fff;
    letter-spacing: 14px;
    margin-bottom: 48px;
    text-transform: uppercase;
  }

  .pause-score-row {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 5px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .pause-score-num {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 72px;
    color: #fff;
    letter-spacing: 5px;
    margin-bottom: 52px;
  }

  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }

  .action-btn {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 7px;
    border: none;
    padding: 15px 44px;
    cursor: pointer;
    transition: transform 0.1s;
    min-width: 200px;
    text-transform: uppercase;
  }

  .action-btn:active { transform: scale(0.97); }

  .btn-primary {
    background: rgba(255,255,255,0.92);
    color: #141414;
  }

  .btn-secondary {
    background: transparent;
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.12);
  }
</style>
</head>
<body>

<!-- Canvas -->
<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud" style="display:none;">
  <div id="score">0</div>
  <div id="pause-btn" onclick="togglePause()">
    <div class="pause-icon">
      <div class="pause-bar"></div>
      <div class="pause-bar"></div>
    </div>
  </div>
</div>

<!-- Start Screen -->
<div id="start-screen" class="screen visible">
  <div class="start-top">
    <div class="game-title">EXPAND</div>
  </div>
  <div class="start-middle">
    <div class="game-subtitle">swipe to destroy</div>
    <div class="instruction">circles that touch — end you</div>
  </div>
  <div class="start-bottom">
    <button class="start-btn" onclick="startGame()">BEGIN</button>
  </div>
</div>

<!-- Game Over Screen -->
<div id="gameover-screen" class="screen">
  <div class="go-label">score</div>
  <div class="go-score" id="go-score-num">0</div>
  <div class="go-best-row">
    <div class="go-best-label">best</div>
    <div class="go-best-score" id="go-best-num">0</div>
  </div>
  <button class="start-btn" onclick="startGame()">AGAIN</button>
  <div id="new-best-label" class="new-best" style="display:none;">new best</div>
</div>

<!-- Pause Screen -->
<div id="pause-screen" class="screen">
  <div class="pause-title">PAUSED</div>
  <div class="pause-score-row">current score</div>
  <div class="pause-score-num" id="pause-score-num">0</div>
  <div class="btn-row">
    <button class="action-btn btn-primary" onclick="togglePause()">RESUME</button>
    <button class="action-btn btn-secondary" onclick="endGameFromPause()">QUIT</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Dot grid
let dotGrid = [];
function buildDotGrid() {
  dotGrid = [];
  const spacing = 22;
  for (let x = spacing; x < W; x += spacing) {
    for (let y = spacing; y < H; y += spacing) {
      dotGrid.push({ x, y });
    }
  }
}

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildDotGrid();
}
resize();
window.addEventListener('resize', resize);

// State
let state = 'start';
let circles = [];
let score = 0;
let best = parseInt(localStorage.getItem('expand_best') || '0');
let animFrame;
let lastTime = 0;
let elapsed = 0;
let gameOverTimer = 0;
let gameOverPhase = 0;
let collidedIdx = [-1, -1];
let dimAlpha = 0;

// Circle pool
function spawnCircle() {
  const margin = 60;
  const minDist = 40; // minimum distance from any existing circle center
  let x, y, attempts = 0, valid = false;

  while (attempts < 20) {
    x = margin + Math.random() * (W - margin * 2);
    y = margin + Math.random() * (H - margin * 2);
    valid = true;
    for (const c of circles) {
      if (c.dead || c.cracking) continue;
      const dist = Math.hypot(x - c.x, y - c.y);
      if (dist < c.r + minDist) { valid = false; break; }
    }
    if (valid) break;
    attempts++;
  }

  // Growth speed: 8–22 px/s at 0s → 85–125 px/s at 120s
  const t = Math.min(elapsed / 120, 1);
  const eased = t * t * (3 - 2 * t);
  const speed = (8 + Math.random() * 14) + eased * (77 + Math.random() * 48);
  circles.push({ x, y, r: 0, speed, dead: false, fillAlpha: 0, cracking: false, crackT: 0, fragAngles: Array.from({length:6}, (_,i) => (i/6)*Math.PI*2 + (Math.random()-0.5)*0.3) });
}

function getSpawnInterval() {
  // 0s:1.6 → 20s:1.0 → 40s:0.7 → 60s:0.4 → 80s:0.3 → 100s:0.2 → 120s:0.1
  const t = Math.min(elapsed / 120, 1);
  const eased = t * t * (3 - 2 * t);
  return Math.max(0.1, 1.6 - eased * 1.5);
}

let spawnTimer = 0;

// Swipe tracking — each point gets its own timestamp
let activePath = [];
let touchStart = null;
let touchCurrent = null;
let trailPoints = []; // global pool of {x, y, age} — each fades 1s after drawn

canvas.addEventListener('touchstart', e => {
  if (state !== 'playing') return;
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  touchCurrent = { x: t.clientX, y: t.clientY };
  activePath = [{ x: t.clientX, y: t.clientY }];
  trailPoints.push({ x: t.clientX, y: t.clientY, age: 0 });
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (state !== 'playing') return;
  const t = e.changedTouches[0];
  touchCurrent = { x: t.clientX, y: t.clientY };
  activePath.push({ x: t.clientX, y: t.clientY });
  trailPoints.push({ x: t.clientX, y: t.clientY, age: 0 });
  checkSwipe(t.clientX, t.clientY);
}, { passive: true });

canvas.addEventListener('touchend', e => {
  if (state !== 'playing') return;
  const t = e.changedTouches[0];
  checkSwipe(t.clientX, t.clientY);
  activePath = [];
  touchStart = null;
  touchCurrent = null;
}, { passive: true });

// Mouse support for desktop testing
let mouseDown = false;
let mouseStart = null;
canvas.addEventListener('mousedown', e => {
  if (state !== 'playing') return;
  mouseDown = true;
  mouseStart = { x: e.clientX, y: e.clientY };
  activePath = [{ x: e.clientX, y: e.clientY }];
  trailPoints.push({ x: e.clientX, y: e.clientY, age: 0 });
});
canvas.addEventListener('mousemove', e => {
  if (!mouseDown || state !== 'playing') return;
  activePath.push({ x: e.clientX, y: e.clientY });
  trailPoints.push({ x: e.clientX, y: e.clientY, age: 0 });
  checkSwipe(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', e => {
  if (state !== 'playing') return;
  if (mouseStart) checkSwipe(e.clientX, e.clientY);
  activePath = [];
  mouseDown = false;
  mouseStart = null;
});

function checkSwipe(ex, ey) {
  if (state !== 'playing') return;
  if (activePath.length < 2) return;
  const prev = activePath[activePath.length - 2];
  const sx = prev.x, sy = prev.y;

  for (let i = circles.length - 1; i >= 0; i--) {
    const c = circles[i];
    if (c.dead || c.cracking) continue;
    if (lineIntersectsCircle(sx, sy, ex, ey, c.x, c.y, c.r)) {
      destroyCircle(i);
    }
  }
}

function lineIntersectsCircle(x1, y1, x2, y2, cx, cy, cr) {
  // Vector from line start to circle center
  const dx = x2 - x1, dy = y2 - y1;
  const fx = x1 - cx, fy = y1 - cy;
  const a = dx*dx + dy*dy;
  if (a < 0.001) {
    // Point check
    return Math.hypot(fx, fy) <= cr;
  }
  const b = 2*(fx*dx + fy*dy);
  const c2 = fx*fx + fy*fy - cr*cr;
  let disc = b*b - 4*a*c2;
  if (disc < 0) return false;
  disc = Math.sqrt(disc);
  const t1 = (-b - disc) / (2*a);
  const t2 = (-b + disc) / (2*a);
  return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1) || (t1 < 0 && t2 > 1);
}

function destroyCircle(i) {
  circles[i].cracking = true;
  circles[i].crackT = 0;
  score++;
  document.getElementById('score').textContent = score;
  playSlash();
}

// Collision detection
function checkCollisions() {
  for (let i = 0; i < circles.length; i++) {
    for (let j = i + 1; j < circles.length; j++) {
      const a = circles[i], b = circles[j];
      if (a.dead || b.dead || a.cracking || b.cracking) continue;
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist <= a.r + b.r) {
        collidedIdx = [i, j];
        triggerGameOver();
        return;
      }
    }
  }
}

// Game over flow
let goFreezeTime = 0.6;
let goFillTime = 1.0;
let goDimTime = 0.8;

function triggerGameOver() {
  state = 'gameover_anim';
  gameOverPhase = 0;
  gameOverTimer = 0;
  dimAlpha = 0;
}

function updateGameOver(dt) {
  gameOverTimer += dt;

  if (gameOverPhase === 0) {
    // Freeze — do nothing, just wait
    if (gameOverTimer > goFreezeTime) {
      gameOverPhase = 1;
      gameOverTimer = 0;
    }
  } else if (gameOverPhase === 1) {
    // Fill collided circles with white
    const t = Math.min(gameOverTimer / goFillTime, 1);
    if (collidedIdx[0] >= 0) circles[collidedIdx[0]].fillAlpha = t;
    if (collidedIdx[1] >= 0) circles[collidedIdx[1]].fillAlpha = t;
    if (t >= 1) {
      gameOverPhase = 2;
      gameOverTimer = 0;
    }
  } else if (gameOverPhase === 2) {
    // Dim to black
    dimAlpha = Math.min(gameOverTimer / goDimTime, 1);
    if (dimAlpha >= 1) {
      gameOverPhase = 3;
      showGameOver();
    }
  }
}

function showGameOver() {
  state = 'gameover';
  document.getElementById('hud').style.display = 'none';

  const isNewBest = score > best;
  if (isNewBest) best = score;
  localStorage.setItem('expand_best', best);

  document.getElementById('go-score-num').textContent = score;
  document.getElementById('go-best-num').textContent = best;
  document.getElementById('new-best-label').style.display = isNewBest ? 'block' : 'none';

  setTimeout(() => {
    document.getElementById('gameover-screen').classList.add('visible');
  }, 100);
}

function startGame() {
  // Hide all screens
  document.getElementById('start-screen').classList.remove('visible');
  document.getElementById('gameover-screen').classList.remove('visible');
  document.getElementById('pause-screen').classList.remove('visible');

  circles = [];
  score = 0;
  elapsed = 0;
  spawnTimer = 0;
  trailPoints = [];
  activePath = [];
  collidedIdx = [-1, -1];
  dimAlpha = 0;
  gameOverPhase = 0;
  gameOverTimer = 0;

  document.getElementById('score').textContent = '0';
  document.getElementById('hud').style.display = 'flex';

  state = 'playing';
  lastTime = performance.now();
  cancelAnimationFrame(animFrame);
  loop(performance.now());
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    document.getElementById('pause-score-num').textContent = score;
    document.getElementById('pause-screen').classList.add('visible');
  } else if (state === 'paused') {
    state = 'playing';
    document.getElementById('pause-screen').classList.remove('visible');
    lastTime = performance.now();
    cancelAnimationFrame(animFrame);
    loop(performance.now());
  }
}

function endGameFromPause() {
  document.getElementById('pause-screen').classList.remove('visible');
  collidedIdx = [-1, -1];
  dimAlpha = 0;
  gameOverPhase = 2;
  gameOverTimer = 0;
  state = 'gameover_anim';
  lastTime = performance.now();
  cancelAnimationFrame(animFrame);
  loop(performance.now());
}

// Sound
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSlash() {
  try {
    const ctx2 = getAudio();
    // Noise burst — crunch/slash feel
    const bufSize = ctx2.sampleRate * 0.08;
    const buf = ctx2.createBuffer(1, bufSize, ctx2.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 2.5);
    }
    const src = ctx2.createBufferSource();
    src.buffer = buf;
    const gain = ctx2.createGain();
    gain.gain.setValueAtTime(0.35, ctx2.currentTime);
    const filter = ctx2.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800;
    filter.Q.value = 0.7;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx2.destination);
    src.start();
  } catch(e) {}
}

// Main loop
function loop(ts) {
  if (state === 'paused') return;

  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  if (state === 'playing') {
    elapsed += dt;
    spawnTimer += dt;
    if (spawnTimer >= getSpawnInterval()) {
      spawnCircle();
      spawnTimer = 0;
    }

    // Update circles
    for (let i = circles.length - 1; i >= 0; i--) {
      const c = circles[i];
      if (c.cracking) {
        c.crackT += dt * 6;
        if (c.crackT >= 1) { c.dead = true; circles.splice(i, 1); }
        continue;
      }
      if (!c.dead) c.r += c.speed * dt;
    }

    checkCollisions();
  }

  // Age trail points in both playing and gameover_anim states
  for (let i = trailPoints.length - 1; i >= 0; i--) {
    trailPoints[i].age += dt;
    if (trailPoints[i].age >= 0.5) trailPoints.splice(i, 1);
  }

  if (state === 'gameover_anim') {
    updateGameOver(dt);
  }

  draw();
  animFrame = requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#141414';
  ctx.fillRect(0, 0, W, H);

  // Dot grid
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  for (const d of dotGrid) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw trail — connect consecutive points, each fading based on its own age
  if (trailPoints.length > 1) {
    for (let i = 1; i < trailPoints.length; i++) {
      const p0 = trailPoints[i - 1];
      const p1 = trailPoints[i];
      const alpha = Math.max(0, 1 - p1.age * 2) * 0.55;
      if (alpha <= 0) continue;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Circles
  for (const c of circles) {
    if (c.dead) continue;

    ctx.save();

    if (c.cracking) {
      // Crack burst effect — draw fragments
      const t = c.crackT;
      ctx.globalAlpha = 1 - t;
      const numFrags = 6;
      for (let f = 0; f < numFrags; f++) {
        const angle = c.fragAngles[f];
        const dist = c.r * 0.3 * t;
        const fx = c.x + Math.cos(angle) * dist;
        const fy = c.y + Math.sin(angle) * dist;
        const fragR = c.r * 0.13 * (1 - t * 0.5);
        ctx.beginPath();
        ctx.arc(fx, fy, fragR, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(200,200,200,0.9)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      // Main circle fades
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * (1 + t * 0.2), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200,200,200,0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      continue;
    }

    // Fill for game over animation
    if (c.fillAlpha > 0) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${c.fillAlpha})`;
      ctx.fill();
    }

    // Circle outline
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210,210,210,0.75)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  // Game over dim overlay
  if (dimAlpha > 0) {
    ctx.fillStyle = `rgba(20,20,20,${dimAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// Initial draw
draw();

// Prevent scroll/bounce
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
